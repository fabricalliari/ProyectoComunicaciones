name: Publicar SonicDrop en GitHub Pages

on:
  push:
    branches: [main, experimento/alta-frecuencia]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verificar el protocolo y el audio
        run: npm test
      - name: Obtener la versión estable para la raíz del sitio
        if: github.ref == 'refs/heads/experimento/alta-frecuencia'
        uses: actions/checkout@v6
        with:
          ref: main
          path: stable-site
      - name: Preparar el sitio con la prueba en una subcarpeta
        if: github.ref == 'refs/heads/experimento/alta-frecuencia'
        run: node scripts/build-preview.mjs
      - name: Subir la web estática
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ github.ref == 'refs/heads/experimento/alta-frecuencia' && '.pages-site' || 'dist' }}

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
